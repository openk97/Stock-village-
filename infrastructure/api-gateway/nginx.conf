# Nginx API Gateway Configuration untuk Arsitektur BFF IHSG Insight
# (Production-grade: rate limit, healthcheck, gzip, security headers)

worker_processes auto;

events {
    worker_connections 2048;   # naikkan dari 1024 (lebih banyak koneksi per worker)
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimasi Kecepatan & Pengiriman Payload Data
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Gzip Compression (Penting untuk mempercepat loading grafik web dan mobile)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # --- Rate Limit ZONE (edge protection — pertahanan pertama) ---
    # Per-IP per menit. Dua zone: ketat untuk endpoint mahal (screener),
    # longgar untuk API umum.
    limit_req_zone $binary_remote_addr zone=api_strict:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=120r/m;

    # Definisi Server Upstream (Lokasi Penampung Backend & BFF)
    upstream web_bff_servers {
        server 127.0.0.1:3000;
        keepalive 32;   # reuse koneksi ke BFF (hemat handshake)
    }

    upstream frontend_static_servers {
        server 127.0.0.1:3001;   # (disarankan pindah ke CDN/object storage untuk skala besar)
    }

    server {
        listen       80; # API Gateway mendengarkan lalu lintas pada port 80 (HTTP Publik)
        server_name  localhost ihsg-insight.com;

        # Header Keamanan Global (Security Headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS — aktifkan hanya setelah HTTPS benar-benar aktif
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # --- GATING (opsional, default AKTIF): proteksi 1-password seluruh app.
        # Aktif karena user memilih gating dulu (pemakaian pribadi/komunitas).
        # File /etc/nginx/.htpasswd wajib ada (lihat generate_htpasswd.sh).
        # Untuk menonaktifkan: hapus/komentari 2 baris auth_basic di bawah.
        auth_basic "Stock Village — akses terbatas";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 1. ROUTING FRONTEND: Mengarahkan traffic halaman utama ke server statis
        location / {
            proxy_pass http://frontend_static_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. ROUTING WEB BFF: Mengarahkan rute /api/web/* ke Web BFF Layer
        location /api/web/ {
            limit_req zone=api_general burst=40 nodelay;   # 120 r/m + burst

            proxy_pass http://web_bff_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            # Penanganan CORS di Gateway (Menghindari masalah blokir lintas asal di browser)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Endpoint mahal (screener/stockpick/korelasi) — rate limit ketat
        location ~ ^/api/web/(screener|correlation|analysis)/ {
            limit_req zone=api_strict burst=10 nodelay;   # 30 r/m + burst 10

            proxy_pass http://web_bff_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
        }

        # Healthcheck BFF (untuk orchestrator / load balancer)
        location = /healthz {
            proxy_pass http://web_bff_servers;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # 3. BLOKIR AKSES KE MICROSERVICES LANGSUNG (Security Best Practice!)
        # Menjamin klien luar tidak boleh bypass BFF dan menembak database/servis internal secara langsung.
        location /api/internal/ {
            return 403 "Akses Ditolak. Seluruh lalu lintas harus melewati gerbang resmi BFF Layer.";
        }

        # Penanganan Halaman Error Kustom Gateway
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
