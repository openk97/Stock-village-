# Nginx API Gateway Configuration untuk Arsitektur BFF IHSG Insight

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimasi Kecepatan & Pengiriman Payload Data
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression (Penting untuk mempercepat loading grafik web dan mobile)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # Definisi Server Upstream (Lokasi Penampung Backend & BFF)
    upstream web_bff_servers {
        server 127.0.0.1:3000; # Alokasi port untuk Web BFF Layer
    }

    upstream mobile_bff_servers {
        server 127.0.0.1:4000; # Alokasi port untuk Mobile BFF Layer
    }

    upstream frontend_static_servers {
        server 127.0.0.1:3001; # Alokasi port untuk Server Next.js Frontend
    }

    server {
        listen       80; # API Gateway mendengarkan lalu lintas pada port 80 (HTTP Publik)
        server_name  localhost ihsg-insight.com;

        # Header Keamanan Global (Security Headers)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 1. ROUTING FRONTEND: Mengarahkan traffic halaman utama ke server Next.js
        location / {
            proxy_pass http://frontend_static_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. ROUTING WEB BFF: Mengarahkan rute /api/web/* ke Web BFF Layer
        location /api/web/ {
            # Hapus prefix /api/web/ sebelum dikirim ke upstream BFF jika diperlukan
            # rewrite ^/api/web/(.*)$ /$1 break;
            
            proxy_pass http://web_bff_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Penanganan CORS di Gateway (Menghindari masalah blokir lintas asal di browser)
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # 3. ROUTING MOBILE BFF: Mengarahkan rute /api/mobile/* ke Mobile BFF Layer
        location /api/mobile/ {
            proxy_pass http://mobile_bff_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Pembatasan Kecepatan khusus untuk Client Mobile guna mencegah DDoS harian
            # limit_req zone=mobile_limit burst=10 nodelay;
        }

        # 4. BLOKIR AKSES KE MICROSERVICES LANGSUNG (Security Best Practice!)
        # Menjamin klien luar tidak boleh bypass BFF dan menembak database/servis internal secara langsung.
        location /api/internal/ {
            return 403 "Akses Ditolak. Seluruh lalu lintas harus melewati gerbang resmi BFF Layer.";
        }

        # Penanganan Halaman Error Kustom Gateway
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
