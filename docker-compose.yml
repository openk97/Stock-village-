version: '3.8'

# ============================================================================
# STOCK VILLAGE — Docker Compose PRODUCTION
# Healthcheck di tiap service + depends_on condition=service_healthy (start
# berurutan yang benar) + batas resource. Semua nilai rahasia dari env file.
# ============================================================================
services:
  # 1. DATABASE PERSISTEN: PostgreSQL (Menampung data historis IHSG, berita, & portofolio)
  db:
    image: postgres:15-alpine
    container_name: ihsg-postgres-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ihsg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ihsg_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-ihsg_insight_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ihsg_admin} -d ${POSTGRES_DB:-ihsg_insight_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # 2. IN-MEMORY CACHE: Redis (Menyimpan cache harga real-time IHSG agar hemat kuota bursa)
  redis:
    image: redis:7-alpine
    container_name: ihsg-redis-cache
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  # 3. MICROSERVICE: IHSG Data Service (FastAPI Python)
  ihsg-data-service:
    build:
      context: ./backend-services/ihsg-data-service
      dockerfile: Dockerfile
    container_name: ihsg-data-service
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WORKERS:-4}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ihsg_admin}:${POSTGRES_PASSWORD:-ihsg_secure_password}@db:5432/${POSTGRES_DB:-ihsg_insight_db}
      - REDIS_URL=redis://redis:6379/0
      - CACHE_BACKEND=redis
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # GoAPI.io: sumber data prioritas utama (TIER 1) untuk kutipan harga
      # saham & broker summary Indonesia. OPSIONAL -- jika GOAPI_API_KEY
      # kosong/tidak diset, aplikasi otomatis fallback ke Yahoo Finance
      # (TIER 2) tanpa error. Daftar/dapatkan API key di https://goapi.io.
      - GOAPI_API_KEY=${GOAPI_API_KEY:-}
      - GOAPI_BASE_URL=${GOAPI_BASE_URL:-https://api.goapi.io}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # 4. BACKEND FOR FRONTEND (BFF) LAYER: Web BFF (TypeScript Node.js)
  web-bff:
    build:
      context: ./bff-layer
      dockerfile: Dockerfile
    container_name: ihsg-web-bff
    restart: always
    environment:
      - PORT=3000
      - IHSG_SERVICE_URL=http://ihsg-data-service:8000/api
      - BFF_FETCH_TIMEOUT_MS=${BFF_FETCH_TIMEOUT_MS:-8000}
    ports:
      - "3000:3000"
    depends_on:
      ihsg-data-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M

  # 5. FRONTEND CLIENT: Next.js Web Dashboard
  frontend-web:
    build:
      context: ./frontend
      dockerfile: web-app/Dockerfile
    container_name: ihsg-frontend-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api/web  # Mengarah ke API Gateway pada port 80 publik
    ports:
      - "3001:3001"
    depends_on:
      - web-bff

  # 6. API GATEWAY: Nginx (Satu-satunya pintu masuk luar publik)
  api-gateway:
    image: nginx:alpine
    container_name: ihsg-api-gateway
    restart: always
    ports:
      - "80:80" # Memetakan port 80 publik ke Nginx internal
    volumes:
      - ./infrastructure/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-web
      - web-bff
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
