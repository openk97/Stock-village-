# Nginx config utk container frontend statis (internal, hanya via gateway).
# Port 3001 konsisten dengan docker-compose (upstream frontend-web:3001).
server {
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip konten statis (hasil Vite sudah di-minify; gzip mengecilkan lagi)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset ber-hash Vite (assets/*-hash.*): cache lama (immutable) -> kunjungan
    # kedua sangat cepat, dan versi baru otomatis ter-pick (nama file berubah).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker: JANGAN di-cache browser (update SW harus cepat terdeteksi)
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # index.html: no-cache (SW yang mengelola shell offline; biar versi baru
    # cepat terlihat setelah SW update)
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Healthcheck liveness (dipakai compose + orchestrator)
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback: semua rute lain -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
