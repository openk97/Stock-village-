name: CI

# CI jalan pada setiap PR ke main dan push ke main.
# 4 gerbang (semuanya HARUS hijau sebelum merge):
#   1. Backend pytest          (27 unit test)
#   2. Frontend unit test + build Vite
#   3. Performance budget      (FCP/JS/CSS/HTML + overflow mobile, Playwright)
#   4. Docker compose build    (validasi semua Dockerfile & compose)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-services/ihsg-data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend-services/ihsg-data-service/requirements-dev.txt
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: python -m pytest tests -q

  frontend-tests:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit test lib.js
        run: node tests/lib.test.js
      - name: Unit test ui.js
        run: node tests/ui.test.js
      - name: Build Vite
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  bff-build:
    name: BFF build (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff-layer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bff-layer/package-lock.json
      - run: npm ci
      - name: Compile TypeScript
        run: npm run build

  perf-budget:
    name: Perf budget (Playwright)
    runs-on: ubuntu-latest
    needs: frontend-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (full chromium)
        run: |
          pip install --no-cache-dir playwright
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Serve dist + audit budget
        run: |
          (cd frontend/dist && nohup python3 -m http.server 8081 >/tmp/http.log 2>&1 &)
          sleep 2
          python3 frontend/tests/perf_budget.py --base http://127.0.0.1:8081/index.html

  docker-build:
    name: Docker compose build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, bff-build]
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env minimal (interpolasi compose)
        run: printf 'POSTGRES_PASSWORD=ci_dummy_password\n' > .env
      - name: Build semua image
        run: docker compose build
